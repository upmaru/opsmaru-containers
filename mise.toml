[tools]
elixir = "1.19.5-otp-27"
erlang = "27.3.4.16"
node = "26.10.0"
"npm:@fission-ai/openspec" = "1.14.0"

[tasks.setup]
description = "Fetch dependencies"
run = "mix deps.get"

[tasks."spec:validate"]
description = "Validate all OpenSpec artifacts strictly"
run = "openspec validate --all --strict --no-interactive"

[tasks."check:reference"]
description = "Check the pinned Docker route inventory and evidence ledger"
run = "mix docker.reference --check"

[tasks."check:consumer"]
description = "Build the Hex artifact and check fresh consumers with and without the web stack"
run = "sh test/acceptance/hex_consumers.sh"

[tasks.check]
description = "Format, compile, strict Credo and library/fixture tests; no real backend"
run = [
  "mix format --check-formatted",
  "mix compile --warnings-as-errors",
  "mix credo --strict",
  "MIX_ENV=test mix do compile --warnings-as-errors + test --warnings-as-errors",
  "mix docker.reference --check",
  "openspec validate --all --strict --no-interactive",
]
