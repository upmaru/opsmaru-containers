name: Release

# Publishes the Hex package and the GitHub Release when main receives the
# merge of a release/<version> PR in this repository. Push-to-main only. GitHub Actions authenticates to Hex with
# OIDC workload identity (no stored key) via the `release` environment, which
# must be restricted to the main branch. See .github/release-runbook.md.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time; runs are never cancelled mid-publish. queue: max
# keeps up to 100 pending runs in the release-main group without replacing
# pending runs; unrelated pushes queue harmlessly ahead or behind the release
# that is in flight.
concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

env:
  HEX_PACKAGE: opsmaru_containers

jobs:
  verify:
    name: Verify merged release PR
    # Push-to-main only, this repository only, with the same merge test.
    if: github.repository == 'upmaru/opsmaru-containers'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Authenticated Actions token reading the commits/pulls association.
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check the merge and the version and changelog
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^  @version "([^"]+)"$/\1/p' mix.exs)
          if [ -z "${version}" ]; then
            echo "Could not read @version from mix.exs" >&2
            exit 1
          fi

          # Eligible release/ PRs are filtered before deciding. The PR
          # association can lag indexing, so empty matches are retried a
          # bounded number of times; a real gh API error aborts the job.
          eligible=""
          count=0
          for attempt in $(seq 1 6); do
            out=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>&1) || {
              echo "Could not read the PR association for ${GITHUB_SHA}: ${out}" >&2
              exit 1
            }
            eligible=$(jq -c --arg sha "${GITHUB_SHA}" --arg repo "${GITHUB_REPOSITORY}" \
              '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main" and .head.repo.full_name == $repo and (.head.ref | startswith("release/")))]' \
              <<< "${out}")
            count=$(jq 'length' <<< "${eligible}")
            if [ "${count}" -ge 1 ]; then
              break
            fi
            if [ "${attempt}" -lt 6 ]; then
              echo "No eligible release/ PR association yet (attempt ${attempt}/6); retrying in 20s"
              sleep 20
            fi
          done

          if [ "${count}" -eq 0 ]; then
            # A valid empty association after bounded retries: not a release merge.
            echo "This push is not exactly the merge of one release/<version> PR; skipping."
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${count}" -ne 1 ]; then
            echo "Expected exactly one eligible release/ PR for ${GITHUB_SHA}, found ${count}; refusing to guess" >&2
            exit 1
          fi
          ref=$(jq -r '.[0].head.ref' <<< "${eligible}")
          if [ "${ref}" != "release/${version}" ]; then
            echo "Release PR head ref is '${ref}', expected 'release/${version}'" >&2
            exit 1
          fi

          # Reject a conflicting pre-existing tag before any Hex upload. One
          # ls-remote call covers both patterns; exit 2 means missing.
          tag="v${version}"
          tag_exists=0
          tag_out=""
          if tag_out=$(git ls-remote --exit-code origin "refs/tags/${tag}" "refs/tags/${tag}^{}" 2>/dev/null); then
            tag_exists=1
          else
            rc=$?
            if [ "${rc}" != "2" ]; then
              echo "git ls-remote failed for tag ${tag} (exit ${rc}); check network and credentials" >&2
              exit 1
            fi
          fi
          if [ "${tag_exists}" -eq 1 ]; then
            peel_line=$(grep -F '^{}' <<< "${tag_out}" | head -1 || true)
            if [ -n "${peel_line}" ]; then
              tag_commit_sha=$(awk '{print $1}' <<< "${peel_line}")
            else
              tag_commit_sha=$(awk '{print $1}' <<< "${tag_out}")
            fi
            if [ "${tag_commit_sha}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${tag} exists at ${tag_commit_sha}, not this merge SHA ${GITHUB_SHA}; rejecting before any Hex upload" >&2
              exit 1
            fi
            echo "Tag ${tag} already exists at the correct merge SHA."
          fi

          # Extract the exact dated, non-empty changelog section.
          heading=$(grep -m1 -E "^## ${version//./\\.} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || true)
          if [ -z "${heading}" ]; then
            echo "CHANGELOG.md has no dated section '## ${version} — YYYY-MM-DD'" >&2
            exit 1
          fi
          notes=$(awk -v heading="${heading}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(tr -d '[:space:]' <<< "${notes}")" ]; then
            echo "CHANGELOG.md section '${heading}' is empty" >&2
            exit 1
          fi
          {
            echo "release=true"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"
          echo "Verified release merge for ${version} (${ref})."

  hex:
    name: Publish to Hex
    needs: verify
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.6.11
          install: false
      - run: mise trust && mise install
      - run: mise exec -- mix local.hex 2.7.0 --force && mise exec -- mix local.rebar --force && mise exec -- mix deps.get
      - name: Run checks before publishing
        run: mise run check
      - name: Build the Hex package
        run: |
          mise exec -- mix hex.build
          version=$(sed -nE 's/^  @version "([^"]+)"$/\1/p' mix.exs)
          archive="opsmaru_containers-${version}.tar"
          sha256sum "${archive}" | awk '{print $1}' > /tmp/archive.sha256
          cat /tmp/archive.sha256
      - name: Inspect the Hex API
        id: hex
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          package_body=$(curl -sS --connect-timeout 10 --max-time 60 -o /tmp/pkg.json -w '%{http_code}' "https://hex.pm/api/packages/${HEX_PACKAGE}" 2>/dev/null) || package_body="000"
          release_body=$(curl -sS --connect-timeout 10 --max-time 60 -o /tmp/rel.json -w '%{http_code}' "https://hex.pm/api/packages/${HEX_PACKAGE}/releases/${version}" 2>/dev/null) || release_body="000"

          for code in "${package_body}" "${release_body}"; do
            case "${code}" in
              200|201|404) ;;
              *) echo "Unexpected Hex API status ${code}; refusing to guess" >&2; exit 1 ;;
            esac
          done

          if [ "${package_body}" = "404" ]; then
            echo "Hex package opsmaru_containers does not exist yet (bootstrap required)." >&2
            echo "Bootstrap it once, manually, from the exact main merge commit:" >&2
            echo "  1. mix hex.user auth" >&2
            echo "  2. mix hex.publish (interactively, NOT with --yes, selecting the upmaru public owner)" >&2
            echo "  3. Configure the org Hex form (Write, upmaru, opsmaru-containers, release.yml, release, public checked, opsmaru_containers, private unchecked)" >&2
            echo "  4. Re-run this workflow. See .github/release-runbook.md" >&2
            exit 1
          fi

          if [ "${release_body}" = "404" ]; then
            echo "action=publish" >> "${GITHUB_OUTPUT}"
          else
            checksum=$(jq -r '.checksum | select(type == "string" and length > 0)' /tmp/rel.json)
            has_docs=$(jq -r '.has_docs | select(type == "boolean")' /tmp/rel.json)
            if [ -z "${checksum}" ] || [ -z "${has_docs}" ]; then
              echo "Release endpoint returned unexpected JSON" >&2
              cat /tmp/rel.json >&2
              exit 1
            fi
            if [ "${checksum}" != "$(cat /tmp/archive.sha256)" ]; then
              echo "Hex already has ${HEX_PACKAGE} ${version} with checksum ${checksum}, but this build is $(cat /tmp/archive.sha256)." >&2
              echo "Refusing to republish or use --replace. If the release is genuinely identical (e.g. a provenance/path difference), confirm the checksums on hex.pm and approve a docs-only/manual re-publish; otherwise investigate the build before merging a new release." >&2
              exit 1
            fi
            if [ "${has_docs}" = "true" ]; then
              echo "action=skip" >> "${GITHUB_OUTPUT}"
            else
              echo "action=docs-only" >> "${GITHUB_OUTPUT}"
            fi
          fi
      - name: Publish (new version)
        if: steps.hex.outputs.action == 'publish'
        run: mise exec -- mix hex.publish --yes --wait
      - name: Docs-only recovery
        if: steps.hex.outputs.action == 'docs-only'
        run: mise exec -- mix hex.publish docs --yes --wait
      - name: Verify the public release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          our=$(cat /tmp/archive.sha256)
          for attempt in $(seq 1 8); do
            code=$(curl -sS --connect-timeout 10 --max-time 60 -o /tmp/rel.json -w '%{http_code}' "https://hex.pm/api/packages/${HEX_PACKAGE}/releases/${version}" 2>/dev/null) || code="000"
            if [ "${code}" = "200" ]; then
              checksum=$(jq -r '.checksum | select(type == "string" and length > 0)' /tmp/rel.json)
              has_docs=$(jq -r '.has_docs | select(type == "boolean")' /tmp/rel.json)
              if [ -n "${checksum}" ] && [ -n "${has_docs}" ]; then
                echo "Public checksum: ${checksum} (built: ${our})"
                echo "Public has_docs: ${has_docs}"
                if [ "${checksum}" = "${our}" ] && [ "${has_docs}" = "true" ]; then
                  exit 0
                fi
              fi
            fi
            echo "Public release not live (attempt ${attempt}/8, status ${code}); retrying in 10s"
            sleep 10
          done
          echo "Public release for ${HEX_PACKAGE} ${version} is not live yet." >&2
          if [ "${code}" != "200" ]; then
            echo "Last status: ${code}" >&2
          fi
          echo "Check the Hex dashboard / staged-docs approval, then rerun the workflow (existing correct tag/release are safe to resume). Do not use --replace." >&2
          exit 1

  release:
    name: GitHub Release
    needs: [verify, hex]
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          tag="v${version}"
          heading=$(grep -m1 -E "^## ${version//./\\.} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md)
          awk -v heading="${heading}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md

          # One ls-remote call covers both patterns; exit 2 means missing.
          tag_exists=0
          tag_out=""
          if tag_out=$(git ls-remote --exit-code origin "refs/tags/${tag}" "refs/tags/${tag}^{}" 2>/dev/null); then
            tag_exists=1
          else
            rc=$?
            if [ "${rc}" != "2" ]; then
              echo "git ls-remote failed for tag ${tag} (exit ${rc}); check network and credentials" >&2
              exit 1
            fi
          fi

          tag_commit_sha=""
          if [ "${tag_exists}" -eq 1 ]; then
            peel_line=$(grep -F '^{}' <<< "${tag_out}" | head -1 || true)
            if [ -n "${peel_line}" ]; then
              tag_commit_sha=$(awk '{print $1}' <<< "${peel_line}")
            else
              tag_commit_sha=$(awk '{print $1}' <<< "${tag_out}")
            fi
            if [ "${tag_commit_sha}" != "${SHA}" ]; then
              echo "Tag ${tag} exists at ${tag_commit_sha}, not this merge SHA ${SHA}; rejecting" >&2
              exit 1
            fi
          fi

          # Existing release: verify it is present and published, not merely
          # any nonempty response.
          release_code=$(curl -sS --connect-timeout 10 --max-time 60 -o /tmp/ghrel.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null) || release_code="000"
          if [ "${release_code}" = "200" ]; then
            draft=$(jq -r '.draft | select(type == "boolean")' /tmp/ghrel.json)
            published_at=$(jq -r '.published_at | select(type == "string" and length > 0)' /tmp/ghrel.json)
            if [ "${draft}" != "false" ] || [ -z "${published_at}" ]; then
              echo "Release ${tag} exists but is not published (draft=${draft:-unknown}, published_at=${published_at:-none}); publishing or removing it is an explicit operator action." >&2
              exit 1
            fi
            if [ "${tag_exists}" -eq 0 ]; then
              echo "Release ${tag} is published but tag ${tag} is missing; refusing to report a correct existing tag. Reconcile the tag on GitHub, then rerun." >&2
              exit 1
            fi
            echo "Tag ${tag} and published release ${tag} already exist at the correct SHA; nothing to do."
            exit 0
          elif [ "${release_code}" != "404" ]; then
            echo "GitHub release lookup returned unexpected status ${release_code}" >&2
            exit 1
          fi

          # Release missing: create the tag at the exact merge SHA (after Hex
          # is verified) and then the release.
          if [ "${tag_exists}" -eq 0 ]; then
            git tag "${tag}" "${SHA}"
            git push origin "refs/tags/${tag}"
            echo "Pushed tag ${tag} at ${SHA}."
          fi

          gh release create "${tag}" \
            --verify-tag \
            --title "${tag}" \
            --notes-file /tmp/notes.md
